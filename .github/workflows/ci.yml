name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  VIPS_CONCURRENCY: 1

jobs:
  quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Install native development libraries
        run: >-
          sudo apt-get update && sudo apt-get install -y --no-install-recommends
          pkg-config libvips-dev libvips-tools ffmpeg
          libheif-plugin-aomdec libheif-plugin-aomenc
          libheif-plugin-libde265 libheif-plugin-x265
          ripgrep shellcheck unzip zip
      - name: Install pinned Python harness tools
        run: python3 -m pip install --user -e './tools/harness[dev]'
      - name: Verify pinned toolchain
        run: rustup show active-toolchain && rustc --version && cargo --version
      - name: Run non-duplicated Rust and repository quality gate
        run: cargo xtask ci
      - name: Run API process smoke
        run: cargo xtask api-smoke

  adapters:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Gnuboard 7
            command: g7-adapter
          - name: Gnuboard 5
            command: g5-adapter
    name: adapter-${{ matrix.command }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Verify Gnuboard adapter toolchains
        run: php --version && composer --version && node --version && npm --version
      - name: Run ${{ matrix.name }} adapter gate
        run: cargo xtask ${{ matrix.command }}

  coverage:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Install coverage harness
        run: cargo install --locked cargo-llvm-cov --version 0.8.7
      - name: Enforce aggregate and component coverage ratchets
        run: cargo xtask coverage

  supply-chain:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Install pinned supply-chain tools
        run: |
          cargo install --locked cargo-audit --version 0.22.2
          cargo install --locked cargo-deny --version 0.20.2
          cargo install --locked cargo-cyclonedx --version 0.5.9
      - name: Audit advisories, licenses, bans, and sources
        run: cargo xtask supply-chain
      - name: Generate CycloneDX workspace SBOM
        run: cargo xtask sbom

  native-fixtures:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Install native runtime
        run: >-
          sudo apt-get update && sudo apt-get install -y --no-install-recommends
          pkg-config libvips-dev libvips-tools ffmpeg
          libheif-plugin-aomdec libheif-plugin-aomenc
          libheif-plugin-libde265 libheif-plugin-x265
      - name: Record exact native dependency inventory
        run: cargo xtask native-inventory
      - name: Execute actual AVIF and MP4 round trips
        run: cargo xtask native-smoke

  storage-conformance:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Verify Docker runtime
        run: docker version
      - name: Run pinned MinIO S3 protocol conformance
        run: cargo xtask storage-conformance

  full-stack-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Install native runtime
        run: >-
          sudo apt-get update && sudo apt-get install -y --no-install-recommends
          pkg-config libvips-dev libvips-tools ffmpeg
          libheif-plugin-aomdec libheif-plugin-aomenc
          libheif-plugin-libde265 libheif-plugin-x265
      - name: Run actual API, MinIO, worker, and sandbox media flow
        run: cargo xtask full-stack-smoke

  gnuboard5-host-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Verify PHP, Composer, and Docker runtimes
        run: php --version && composer --version && docker version
      - name: Install Gnuboard 5 adapter dependencies
        run: |
          for attempt in 1 2 3; do
            if composer install --working-dir=adapters/gnuboard5/jiwonpapa-g7mediabooster --no-interaction --prefer-dist; then
              exit 0
            fi
            if [ "$attempt" -eq 3 ]; then exit 1; fi
            sleep "$((attempt * 5))"
          done
      - name: Run MySQL and MyISAM host contract
        run: bash scripts/gnuboard5-session-store-smoke.sh

  gnuboard7-stock-compatibility:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: g7mb-ci-only
          MYSQL_DATABASE: g7mb_corefree_testing
        ports: [3306:3306]
        options: >-
          --health-cmd="mysqladmin ping -h localhost -pg7mb-ci-only"
          --health-interval=10s --health-timeout=5s --health-retries=10
    env:
      DB_WRITE_HOST: 127.0.0.1
      DB_WRITE_DATABASE: g7mb_corefree_testing
      DB_WRITE_USERNAME: root
      DB_WRITE_PASSWORD: g7mb-ci-only
      DB_READ_HOST: 127.0.0.1
      DB_READ_DATABASE: g7mb_corefree_testing
      DB_READ_USERNAME: root
      DB_READ_PASSWORD: g7mb-ci-only
    steps:
      - name: Checkout G7MediaBooster
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Checkout official Gnuboard7 7.1.0 (unchanged source)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: gnuboard/g7
          ref: dbe88420c3219f42db1ac16a7e6bb17a438e144d
          path: upstream-gnuboard7
      - name: Install official locked PHP dependencies
        run: |
          composer install --working-dir=upstream-gnuboard7 --no-interaction --prefer-dist --no-progress
          cp upstream-gnuboard7/.env.testing.example upstream-gnuboard7/.env.testing
          php upstream-gnuboard7/artisan key:generate --env=testing --force
          rsync -a --exclude node_modules --exclude vendor adapters/gnuboard7/jiwonpapa-g7mediabooster/ \
            upstream-gnuboard7/modules/_bundled/jiwonpapa-g7mediabooster/
      - name: Verify stock activation, native layout and security regressions
        run: |
          test "$(jq -r '.version' upstream-gnuboard7/modules/_bundled/sirsoft-board/module.json)" = "1.2.0"
          test "$(jq -r '.g7_version' adapters/gnuboard7/jiwonpapa-g7mediabooster/module.json)" = ">=7.1.0"
          test "$(jq -r '.dependencies.modules["sirsoft-board"]' adapters/gnuboard7/jiwonpapa-g7mediabooster/module.json)" = ">=1.2.0"
          php scripts/verify-gnuboard7-module-host.php upstream-gnuboard7 adapters/gnuboard7/jiwonpapa-g7mediabooster
          G7MB_TEST_HOST_ROOT="$PWD/upstream-gnuboard7" upstream-gnuboard7/vendor/bin/phpunit \
            -c adapters/gnuboard7/jiwonpapa-g7mediabooster/phpunit.xml --do-not-cache-result
          bash scripts/g7-host-security-gate.sh "$PWD/upstream-gnuboard7"
          git -C upstream-gnuboard7 diff --exit-code -- app resources/js/core modules templates

  server-bundle:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - name: Install native and archive dependencies
        run: >-
          sudo apt-get update && sudo apt-get install -y --no-install-recommends
          pkg-config libvips-dev libvips-tools ffmpeg
          libheif-plugin-aomdec libheif-plugin-aomenc
          libheif-plugin-libde265 libheif-plugin-x265
          jq unzip zip
      - name: Build and verify one-command server bundle
        run: cargo xtask server-package
      - name: Install, configure, start, and diagnose the bundled server
        run: bash scripts/server-install-smoke.sh
