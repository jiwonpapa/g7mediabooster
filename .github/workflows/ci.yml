name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  VIPS_CONCURRENCY: 1

jobs:
  quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Install native development libraries
        run: >-
          sudo apt-get update && sudo apt-get install -y --no-install-recommends
          pkg-config libvips-dev libvips-tools ffmpeg
          libheif-plugin-aomdec libheif-plugin-aomenc
          libheif-plugin-libde265 libheif-plugin-x265
          ripgrep shellcheck unzip zip
      - name: Install pinned Python harness tools
        run: python3 -m pip install --user -e './tools/harness[dev]'
      - name: Verify pinned toolchain
        run: rustup show active-toolchain && rustc --version && cargo --version
      - name: Run non-duplicated Rust and repository quality gate
        run: cargo xtask ci
      - name: Run API process smoke
        run: cargo xtask api-smoke

  adapters:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Gnuboard 7
            command: g7-adapter
          - name: Gnuboard 5
            command: g5-adapter
    name: adapter-${{ matrix.command }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Verify Gnuboard adapter toolchains
        run: php --version && composer --version && node --version && npm --version
      - name: Run ${{ matrix.name }} adapter gate
        run: cargo xtask ${{ matrix.command }}

  coverage:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Install coverage harness
        run: cargo install --locked cargo-llvm-cov --version 0.8.7
      - name: Enforce aggregate and component coverage ratchets
        run: cargo xtask coverage

  supply-chain:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Install pinned supply-chain tools
        run: |
          cargo install --locked cargo-audit --version 0.22.2
          cargo install --locked cargo-deny --version 0.20.2
          cargo install --locked cargo-cyclonedx --version 0.5.9
      - name: Audit advisories, licenses, bans, and sources
        run: cargo xtask supply-chain
      - name: Generate CycloneDX workspace SBOM
        run: cargo xtask sbom

  native-fixtures:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Install native runtime
        run: >-
          sudo apt-get update && sudo apt-get install -y --no-install-recommends
          pkg-config libvips-dev libvips-tools ffmpeg
          libheif-plugin-aomdec libheif-plugin-aomenc
          libheif-plugin-libde265 libheif-plugin-x265
      - name: Record exact native dependency inventory
        run: cargo xtask native-inventory
      - name: Execute actual AVIF and MP4 round trips
        run: cargo xtask native-smoke

  storage-conformance:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Verify Docker runtime
        run: docker version
      - name: Run pinned MinIO S3 protocol conformance
        run: cargo xtask storage-conformance

  full-stack-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Install native runtime
        run: >-
          sudo apt-get update && sudo apt-get install -y --no-install-recommends
          pkg-config libvips-dev libvips-tools ffmpeg
          libheif-plugin-aomdec libheif-plugin-aomenc
          libheif-plugin-libde265 libheif-plugin-x265
      - name: Run actual API, MinIO, worker, and sandbox media flow
        run: cargo xtask full-stack-smoke

  gnuboard5-host-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Verify PHP, Composer, and Docker runtimes
        run: php --version && composer --version && docker version
      - name: Install Gnuboard 5 adapter dependencies
        run: composer install --working-dir=adapters/gnuboard5/jiwonpapa-g7mediabooster --no-interaction --prefer-dist
      - name: Run MySQL and MyISAM host contract
        run: bash scripts/gnuboard5-session-store-smoke.sh

  gnuboard7-stock-compatibility:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout G7MediaBooster
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Checkout official Gnuboard7 7.0.6
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: gnuboard/g7
          ref: 71ff784b9018f359b4ee764a532b9e83a72c2eff
          path: upstream-gnuboard7
      - name: Verify official versions and fail-closed capability gate
        run: |
          test "$(jq -r '.version' upstream-gnuboard7/modules/_bundled/sirsoft-board/module.json)" = "1.0.3"
          test "$(jq -r '.g7_version' upstream-gnuboard7/modules/_bundled/sirsoft-board/module.json)" = ">=7.0.6"
          test "$(jq -r '.g7_version' adapters/gnuboard7/jiwonpapa-g7mediabooster/module.json)" = ">=7.0.6"
          test "$(jq -r '.dependencies.modules["sirsoft-board"]' adapters/gnuboard7/jiwonpapa-g7mediabooster/module.json)" = ">=1.0.3"
          if php scripts/verify-gnuboard7-module-host.php \
              upstream-gnuboard7 \
              adapters/gnuboard7/jiwonpapa-g7mediabooster \
              >host-contract.log 2>&1; then
            echo "stock G7 unexpectedly exposed the external-media capability" >&2
            exit 1
          fi
          grep -F "G7MB_G7_CONTRACT_FILE_MISSING" host-contract.log

  server-bundle:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - name: Install native and archive dependencies
        run: >-
          sudo apt-get update && sudo apt-get install -y --no-install-recommends
          pkg-config libvips-dev libvips-tools ffmpeg
          libheif-plugin-aomdec libheif-plugin-aomenc
          libheif-plugin-libde265 libheif-plugin-x265
          jq unzip zip
      - name: Build and verify one-command server bundle
        run: cargo xtask server-package
      - name: Install, configure, start, and diagnose the bundled server
        run: bash scripts/server-install-smoke.sh
