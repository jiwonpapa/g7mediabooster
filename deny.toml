[graph]
all-features = true
targets = [
    "aarch64-apple-darwin",
    "x86_64-unknown-linux-gnu",
]

[advisories]
# aws-sdk-s3 uses lru only for an internal S3 Express cache whose CacheKey wraps
# String and cannot panic on Drop. Remove when AWS SDK accepts lru >=0.18.2.
ignore = ["RUSTSEC-2026-0253"]

[licenses]
confidence-threshold = 0.93
unused-license-exception = "allow"
allow = [
    "Apache-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "MIT",
    "Unicode-3.0",
    "Zlib",
]
exceptions = [
    { allow = ["ISC", "MIT-0"], crate = "aws-lc-sys" },
    { allow = ["ISC"], crate = "aws-lc-rs" },
    { allow = ["ISC"], crate = "rustls-webpki" },
    { allow = ["ISC"], crate = "untrusted" },
]

[bans]
multiple-versions = "allow"
wildcards = "deny"
highlight = "all"
allow = []
deny = []
skip = []
skip-tree = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
